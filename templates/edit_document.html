<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Editar documento — Folios</title>

  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <!-- Tipografía -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="../static/css/styles.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="sidebar__profile">
        <div class="sidebar__avatar"><i class="bi bi-person"></i></div>
        <div>
          <h2 id="sidebarNombre">Estudiante</h2>
          <p id="sidebarDetalle">Universidad de Medellín</p>
        </div>
      </div>

      <nav class="sidebar__nav" aria-label="Navegación lateral">
        <a href="documents.html" class="sidebar__link active">
          <i class="bi bi-journal-text"></i>
          <span>Explorar apuntes</span>
        </a>
        <a href="upload_document.html" class="sidebar__link">
          <i class="bi bi-cloud-arrow-up"></i>
          <span>Subir documento</span>
        </a>
        <a href="my_documents.html" class="sidebar__link">
          <i class="bi bi-files"></i>
          <span>Mis documentos</span>
        </a>
        <a href="profile.html" class="sidebar__link">
          <i class="bi bi-person-circle"></i>
          <span>Mi perfil</span>
        </a>
      </nav>

      <div class="sidebar__footer">
        <button type="button" class="btn btn-outline sidebar__logout" id="btnCerrarSesionSidebar">
          <i class="bi bi-box-arrow-right"></i>
          Cerrar sesión
        </button>
      </div>
    </aside>

    <div class="content-area">
      <!-- ==================== NAVBAR ==================== -->
      <header>
        <nav class="navbar container">
          <a href="index.html" class="navbar__logo">
            <img src="../static/assets/logo.png" alt="Logo Folios">
            Folios
          </a>

          <button type="button" class="navbar__toggle" aria-label="Abrir menú">
            <i class="bi bi-list"></i>
          </button>
        </nav>
      </header>

      <main>
        <!-- ==================== FORMULARIO ==================== -->
        <section class="form-section">
          <div class="container">
            <div class="form-card">
              <h1>Editar documento</h1>
              <span class="form-card__subtitle">Cambia los datos que quieras. La fecha de publicación y las calificaciones no se modifican.</span>

              <form id="formDocumento" data-modo="editar" novalidate>

                <div class="form-group">
                  <label for="nombre">Nombre del documento</label>
                  <input type="text" id="nombre" name="nombre" placeholder="Ej: Resumen de límites y derivadas" maxlength="150" required>
                  <span class="form-error" id="errorNombre"></span>
                </div>

                <div class="form-group">
                  <label for="materia">Materia</label>
                  <select id="materia" name="materia" required>
                    <option value="" selected disabled>Selecciona la materia</option>
                  </select>
                  <span class="form-error" id="errorMateria"></span>
                </div>

                <div class="form-group">
                  <label for="categoria">Categoría</label>
                  <select id="categoria" name="categoria" required>
                    <option value="" selected disabled>Selecciona la categoría</option>
                  </select>
                  <span class="form-error" id="errorCategoria"></span>
                </div>

                <div class="form-group">
                  <label for="enlace">Enlace del archivo</label>
                  <input type="url" id="enlace" name="enlace" placeholder="https://drive.google.com/..." maxlength="255" required>
                  <span class="form-error" id="errorEnlace"></span>
                </div>

                <div class="form-group">
                  <label for="descripcion">Descripción (opcional)</label>
                  <textarea id="descripcion" name="descripcion" rows="4" placeholder="¿Qué contiene? Ej: Apuntes del primer corte"></textarea>
                  <span class="form-error" id="errorDescripcion"></span>
                </div>

                <span class="form-error" id="errorGeneral"></span>
                <button type="submit" class="btn btn-primary">Guardar cambios</button>
                <a href="documents.html" class="btn btn-outline" id="enlaceCancelar">Cancelar</a>
              </form>
            </div>
          </div>
        </section>
      </main>

      <!-- ==================== FOOTER ==================== -->
      <footer class="footer">
        <div class="container">
          <ul class="footer__links">
            <li><a href="index.html">Inicio</a></li>
          </ul>
          <p>&copy; 2026 Folios. Proyecto académico.</p>
        </div>
      </footer>
    </div>
  </div>

  <script src="../static/js/app.js"></script>
</body>
</html>
