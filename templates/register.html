<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro — Folios</title>

  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <!-- Tipografía -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="../static/css/styles.css">
</head>
<body>

  <!-- ==================== NAVBAR ==================== -->
  <header>
    <nav class="navbar container">
      <a href="index.html" class="navbar__logo">
        <img src="../static/assets/logo.png" alt="Logo Folios">
        Folios
      </a>

      <button type="button" class="navbar__toggle" aria-label="Abrir menú">
        <i class="bi bi-list"></i>
      </button>

      <div class="navbar__buttons">
        <a href="index.html" class="btn btn-primary">Inicio</a>
      </div>
    </nav>
  </header>

  <main>
    <section class="form-section">
      <div class="container">
        <div class="form-card">
          <h1>Crear cuenta</h1>
          <span class="form-card__subtitle">Regístrate con tu correo institucional</span>

          <form id="formRegistro" novalidate>

            <div class="form-group">
              <label for="nombre">Nombre completo</label>
              <input type="text" id="nombre" name="nombre" placeholder="Ej: Laura Gómez" required>
              <span class="form-error" id="errorNombre"></span>
            </div>

            <div class="form-group">
              <label for="correo">Correo institucional</label>
              <input type="email" id="correo" name="correo" placeholder="nombre@soyudemedellin.edu.co" required>
              <span class="form-error" id="errorCorreo"></span>
            </div>

            <div class="form-group">
              <label for="semestre">Semestre</label>
              <select id="semestre" name="semestre" required>
                <option value="" selected disabled>Selecciona tu semestre</option>
                <option value="1">1</option>
                <option value="2">2</option>
                <option value="3">3</option>
                <option value="4">4</option>
                <option value="5">5</option>
                <option value="6">6</option>
                <option value="7">7</option>
                <option value="8">8</option>
                <option value="9">9</option>
                <option value="10">10</option>
              </select>
              <span class="form-error" id="errorSemestre"></span>
            </div>

            <div class="form-group">
              <label for="programa">Programa académico</label>
              <select id="programa" name="programa" required>
                <option value="" selected disabled>Selecciona tu programa</option>
                <optgroup label="Facultad de Ingenierías">
                  <option value="Ingeniería de Sistemas">Ingeniería de Sistemas</option>
                  <option value="Ingeniería Financiera">Ingeniería Financiera</option>
                  <option value="Ingeniería Civil">Ingeniería Civil</option>
                  <option value="Ingeniería Industrial">Ingeniería Industrial</option>
                </optgroup>
              </select>
              <span class="form-error" id="errorPrograma"></span>
            </div>

            <div class="form-group">
              <label for="contrasena">Contraseña</label>
              <input type="password" id="contrasena" name="contrasena" placeholder="Mínimo 6 caracteres" minlength="6" required>
              <span class="form-error" id="errorContrasena"></span>
            </div>

            <span class="form-error" id="errorGeneral"></span>
            <button type="submit" class="btn btn-primary">Registrarse</button>
          </form>

          <p class="form-footer-text">¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a></p>
        </div>
      </div>
    </section>
  </main>

  <!-- ==================== FOOTER ==================== -->
  <footer class="footer">
    <div class="container">
      <ul class="footer__links">
        <li><a href="index.html">Inicio</a></li>
        <li><a href="login.html">Iniciar sesión</a></li>
        <li><a href="register.html">Registrarse</a></li>
      </ul>
      <p>&copy; 2026 Folios. Proyecto académico.</p>
    </div>
  </footer>

  <script src="../static/js/app.js"></script>
</body>
</html>
