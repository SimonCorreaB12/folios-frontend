name: CI frontend

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Construir la imagen
        run: docker build -t folios-frontend:ci .

      - name: Arrancar el contenedor
        # nginx verifica al arrancar que "backend" exista; aquí no hay backend,
        # así que lo apuntamos a localhost solo para que nginx inicie
        run: docker run -d --name web -p 8080:80 --add-host backend:127.0.0.1 folios-frontend:ci

      - name: Comprobar que nginx sirve el sitio
        run: |
          sleep 2
          curl --fail http://localhost:8080/templates/index.html > /dev/null

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar Playwright
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Pruebas de Playwright que no dependen de la API
        run: npx playwright test --grep "página de inicio|sin sesión"

      - name: Logs de nginx si algo falló
        if: failure()
        run: docker logs web

  build-push:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Calcular SHA corto
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            scorrea884/folios-frontend:${{ env.SHORT_SHA }}
            scorrea884/folios-frontend:latest