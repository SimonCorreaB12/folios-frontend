name: CI frontend

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # JOB 1: prueba de humo, construir la imagen y verificar que nginx sirve el sitio
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Construir imagen de prueba
        run: docker build -t folios-frontend:test .

      - name: Levantar nginx
        # --add-host: nginx exige que el host "backend" exista al arrancar
        run: docker run -d --name web -p 8080:80 --add-host backend:127.0.0.1 folios-frontend:test

      - name: Verificar que las páginas responden
        run: |
          sleep 3
          curl -f http://localhost:8080/
          curl -f http://localhost:8080/templates/login.html
          curl -f http://localhost:8080/static/js/app.js

      - name: Logs de nginx si algo falla
        if: failure()
        run: docker logs web

  # JOB 2: publicar la imagen, SOLO si la prueba pasó
  build-push:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Calcular SHA corto
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/folios-frontend:${{ env.SHORT_SHA }}
            ${{ secrets.DOCKERHUB_USERNAME }}/folios-frontend:latest